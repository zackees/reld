name: Sanitizers

# ASAN / LSAN / UBSAN and Miri.
#
# These jobs cover the reld-owned workload generator. The inherited linker has its full
# Linux-only acceptance suite in ci.yml's development container.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"
  pull_request:
    paths:
      - "crates/reld-testkit/**"
      - ".github/workflows/sanitizers.yml"

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  asan:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install clang/lld
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: cargo test under ASAN
        env:
          # -Zbuild-std is required so that std itself is instrumented; without it ASAN
          # misses anything that crosses a std boundary and reports false negatives.
          RUSTFLAGS: "-Zsanitizer=address -Cdebuginfo=1"
          RUSTDOCFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=1:detect_stack_use_after_return=1:abort_on_error=1"
        run: |
          cargo +nightly test \
            -Zbuild-std \
            -p reld-testkit \
            --target x86_64-unknown-linux-gnu

  ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: cargo test under UBSAN
        env:
          RUSTFLAGS: "-Zsanitizer=undefined -Cdebuginfo=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          cargo +nightly test \
            -Zbuild-std \
            -p reld-testkit \
            --target x86_64-unknown-linux-gnu

  miri:
    name: Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: cargo miri test
        env:
          # Miri cannot run subprocesses, so the stress harness (which shells out to a
          # compiler) is excluded. Miri's job here is the pure data structures —
          # symbol tables, arenas, section graphs — which is exactly where it is
          # strongest and where ASAN is weakest.
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"
        run: cargo +nightly miri test -p reld-testkit --lib
