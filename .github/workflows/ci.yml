name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "agents/**"
      - "docs/**"
      - "LICENSE*"
      - "NOTICE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "agents/**"
      - "docs/**"
      - "LICENSE*"
      - "NOTICE"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_COMMAND: cargo
  RUST_VERSION: 1.95.0
  NIGHTLY_TOOLCHAIN: nightly-2026-08-01
  CLANG_VERSION: 22.1.8
  CLANG_PACKAGE_VERSION: "1:22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80"
  LLD_VERSION: 18.1.8
  MOLD_VERSION: 2.41.0
  WILD_VERSION: 0.9.0
  MSYS2_BINUTILS_VERSION: 2.46.1-2
  MSVC_LINK_VERSION: "14.44"
  APPLE_LD_VERSION: "1053.12"
  LIBTINFO5_VERSION: "6.3-2ubuntu0.3"
  # One pinned cargo-nextest for both the archive producer (phase1-cross-build)
  # and the replaying runner (phase1-native-run), so they agree on the archive
  # format. Kept equal to setup-soldr 0.9.18's pinned cargo-nextest; both jobs
  # install it explicitly rather than relying on whatever soldr bundles.
  NEXTEST_VERSION: "0.9.140"

jobs:
  hygiene:
    name: Format, clippy, and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Enforce approved Rust dependency graph
        run: python3 ci/check_dependencies.py

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@8261f1f64137bdbc4bc1035170d52408e108cbd4 # cargo-deny
        with:
          tool: cargo-deny
      - run: $CARGO_COMMAND fmt --all -- --check
      - run: $CARGO_COMMAND clippy --workspace --all-targets -- -D warnings
      - run: $CARGO_COMMAND deny check licenses

  # Host-platform boundary (reld#137): host cfg and native OS APIs live only in the
  # `platforms/mod.rs` selector and the `platforms/platform_<tree>` concrete trees. The lint scans
  # every physical source file pre-expansion, so code cfg'd away on this Linux host is still
  # checked and one host suffices. Whole files reached through a feature-gated `mod`/`path`
  # (e.g. `linker_plugins_disabled.rs`) are only loaded when that feature state is active, hence
  # the default and `--no-default-features` passes.
  dylint:
    name: Dylint host-platform boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DYLINT_DIR: dylints/ban_platform_cfg_outside_boundary
      DYLINT_VERSION: 6.0.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Install Dylint nightly toolchain
        shell: bash
        run: |
          set -euxo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' "${DYLINT_DIR}/rust-toolchain.toml")"
          test -n "${channel}"
          rustup toolchain install "${channel}" \
            --profile minimal \
            --component rustc-dev \
            --component llvm-tools-preview \
            --component rust-src \
            --component rustfmt

      - name: Install cargo-dylint and dylint-link
        shell: bash
        run: |
          set -euxo pipefail
          cargo install cargo-dylint --version "${DYLINT_VERSION}" --locked
          cargo install dylint-link --version "${DYLINT_VERSION}" --locked

      - name: Check lint formatting
        shell: bash
        working-directory: ${{ env.DYLINT_DIR }}
        run: cargo fmt --check

      - name: Test lint (unit + UI)
        shell: bash
        working-directory: ${{ env.DYLINT_DIR }}
        run: cargo test

      - name: Lint workspace (default features)
        shell: bash
        run: cargo dylint --path "${DYLINT_DIR}" --workspace -- --all-targets

      - name: Lint workspace (no default features)
        shell: bash
        run: cargo dylint --path "${DYLINT_DIR}" --workspace -- --all-targets --no-default-features

  phase1-native:
    name: Phase 1 / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PHASE1_UPSTREAM_FAILED: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gnu x86_64
            kind: linux-gnu
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            musl_target: x86_64-unknown-linux-musl
            ubuntu_archive: https://archive.ubuntu.com/ubuntu/
          - name: linux-gnu aarch64
            kind: linux-gnu
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            musl_target: aarch64-unknown-linux-musl
            # arm64 packages are only published on Ubuntu's ports archive, not the
            # primary x86_64-only archive.ubuntu.com mirror.
            ubuntu_archive: https://ports.ubuntu.com/ubuntu-ports/
          - name: windows-gnu x86_64
            kind: windows-gnu
            os: windows-2022
            target: x86_64-pc-windows-gnu
            arch: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"

      - name: Sync Python tooling
        shell: bash
        run: uv sync --extra dev

      - if: matrix.kind == 'windows-gnu'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-clang

      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          version: 18.1.8

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux fixture Rust toolchain
        if: matrix.kind == 'linux-gnu'
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install "${NIGHTLY_TOOLCHAIN}" \
            --profile minimal \
            --target ${{ matrix.musl_target }} \
            --component rustc-codegen-cranelift-preview
          rustup toolchain list | grep -q "^${NIGHTLY_TOOLCHAIN}-${{ matrix.target }}"
          printf 'fn main() {}\n' > "${RUNNER_TEMP}/nightly-smoke.rs"
          rustup run "${NIGHTLY_TOOLCHAIN}" rustc \
            -Zcodegen-backend=cranelift \
            --target ${{ matrix.musl_target }} \
            "${RUNNER_TEMP}/nightly-smoke.rs" \
            -o "${RUNNER_TEMP}/nightly-smoke"
          "${RUNNER_TEMP}/nightly-smoke"

      - name: Install host test tooling
        uses: taiki-e/install-action@8261f1f64137bdbc4bc1035170d52408e108cbd4 # taplo-cli
        with:
          tool: taplo-cli@0.10.0

      - name: Install Linux clang toolchain
        if: matrix.kind == 'linux-gnu'
        shell: bash
        run: |
          set -euxo pipefail
          # GitHub's Azure mirror can accept the connection and then stall
          # indefinitely while fetching package indexes. Use Ubuntu's HTTPS
          # archive directly and keep network failures bounded.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|${{ matrix.ubuntu_archive }}|' /etc/apt/sources.list.d/ubuntu.sources
          APT_OPTIONS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=30)
          curl -fsSL -o "${RUNNER_TEMP}/llvm-snapshot.gpg.key" https://apt.llvm.org/llvm-snapshot.gpg.key
          echo '8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  '${RUNNER_TEMP}'/llvm-snapshot.gpg.key' | sha256sum --check
          gpg --dearmor < "${RUNNER_TEMP}/llvm-snapshot.gpg.key" > "${RUNNER_TEMP}/llvm-snapshot.gpg"
          sudo install -m 644 "${RUNNER_TEMP}/llvm-snapshot.gpg" /usr/share/keyrings/llvm-snapshot.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get "${APT_OPTIONS[@]}" update
          sudo apt-get "${APT_OPTIONS[@]}" install -y \
            "clang-22=${CLANG_PACKAGE_VERSION}" \
            "llvm-22-linker-tools=${CLANG_PACKAGE_VERSION}"

      # The mold/wild release tarballs and the libtinfo5 .deb are the heavy, pinned
      # downloads paid on every run. Cache them keyed on the pinned versions so
      # subsequent runs restore them instead of re-fetching. The version-drift
      # smoke step below is the correctness gate on a cache hit.
      - name: Restore cached Linux reference linkers
        if: matrix.kind == 'linux-gnu'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/reld-linker-cache
          key: linkers-${{ runner.os }}-${{ runner.arch }}-mold${{ env.MOLD_VERSION }}-wild${{ env.WILD_VERSION }}-libtinfo${{ env.LIBTINFO5_VERSION }}

      - name: Provision cached Linux reference linkers
        if: matrix.kind == 'linux-gnu'
        shell: bash
        run: |
          set -euxo pipefail
          # Cache-gated: no-op for artifacts already restored above; download +
          # verify only on a miss. Installs the cached libtinfo5 .deb, symlinks
          # clang-22/clang++-22, and appends the cache bin dir to GITHUB_PATH.
          uv run --no-sync python ci/linker_setup.py \
            --cache-dir "${RUNNER_TEMP}/reld-linker-cache" \
            --install-debs \
            --link-clang \
            --arch "${{ matrix.arch }}"

      - name: Verify and smoke Linux reference linkers
        if: matrix.kind == 'linux-gnu'
        shell: bash
        run: |
          set -euxo pipefail
          ld.bfd --version | head -1 | tee versions.txt
          ld.lld --version | head -1 | tee -a versions.txt
          mold --version | head -1 | tee -a versions.txt
          ld.wild --version | head -1 | tee -a versions.txt
          clang --version | head -1 | tee -a versions.txt
          ld.bfd --version | grep -q '2.42'
          ld.lld --version | grep -q "${LLD_VERSION}"
          mold --version | grep -q "${MOLD_VERSION}"
          ld.wild --version | grep -q "${WILD_VERSION}"
          clang --version | grep -q "${CLANG_VERSION}"
          printf 'int fixture(void) { return 0; }\n' | clang -shared -nostdlib -flto -x c - -fuse-ld=bfd -o "${RUNNER_TEMP}/plugin-smoke.so"
          printf 'int fixture(void) { return 0; }\n' | clang -c -x c - -Wa,--crel,--allow-experimental-crel -o "${RUNNER_TEMP}/crel-smoke.o"
          case "${{ matrix.arch }}" in
            x86_64) printf '.global _start\n.text\n_start:\n  mov $60, %%rax\n  xor %%rdi, %%rdi\n  syscall\n' > "${RUNNER_TEMP}/smoke.S" ;;
            aarch64) printf '.global _start\n.text\n_start:\n  mov x8, #93\n  mov x0, #0\n  svc #0\n' > "${RUNNER_TEMP}/smoke.S" ;;
          esac
          clang -c "${RUNNER_TEMP}/smoke.S" -o "${RUNNER_TEMP}/smoke.o"
          for linker in ld.bfd ld.lld mold ld.wild; do
            "${linker}" -e _start "${RUNNER_TEMP}/smoke.o" -o "${RUNNER_TEMP}/smoke-${linker}"
            test -s "${RUNNER_TEMP}/smoke-${linker}"
            "${RUNNER_TEMP}/smoke-${linker}"
          done

      - name: Verify and smoke Windows GNU reference linkers
        if: matrix.kind == 'windows-gnu'
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          llvm_bin="$(cygpath -u "${LLVM_PATH}")/bin"
          install -m 755 "${llvm_bin}/ld.lld.exe" /ucrt64/bin/ld.lld.exe
          curl -fsSL -o "${RUNNER_TEMP}/binutils.pkg.tar.zst" "https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-binutils-${MSYS2_BINUTILS_VERSION}-any.pkg.tar.zst"
          echo '631ff3c6d043a4eeca151415c313bda713537d4a7c6807eb7a2d4e7a026df89b  '${RUNNER_TEMP}'/binutils.pkg.tar.zst' | sha256sum --check
          pacman -U --noconfirm "${RUNNER_TEMP}/binutils.pkg.tar.zst"
          ld --version | head -1 | tee versions.txt
          ld.lld --version | head -1 | tee -a versions.txt
          ld.lld --version | grep -q "${LLD_VERSION}"
          pacman -Q mingw-w64-ucrt-x86_64-binutils | tee -a versions.txt
          pacman -Q mingw-w64-ucrt-x86_64-binutils | grep -q "${MSYS2_BINUTILS_VERSION}"
          printf 'int main(void) { return 0; }\n' > "${RUNNER_TEMP}/smoke.c"
          clang "${RUNNER_TEMP}/smoke.c" -fuse-ld=bfd -o "${RUNNER_TEMP}/smoke-bfd.exe"
          clang "${RUNNER_TEMP}/smoke.c" -fuse-ld=lld -o "${RUNNER_TEMP}/smoke-lld.exe"
          "${RUNNER_TEMP}/smoke-bfd.exe"
          "${RUNNER_TEMP}/smoke-lld.exe"

      - name: Linux build and native tests
        if: matrix.kind == 'linux-gnu'
        shell: bash
        env:
          RELD_VERIFY_PLATFORM_REQUIREMENTS: "1"
          RELD_TEST_CONFIG: ${{ github.workspace }}/test-config-ci.toml
        run: |
          set -euxo pipefail
          $CARGO_COMMAND build --workspace --all-targets
          bash ci/install-driver-shims.sh debug
          $CARGO_COMMAND test -p reld-layout-schema -p reld-diff -p reld-testkit --all-targets 2>&1 | tee platform-tests.log
          $CARGO_COMMAND test -p reld-core --lib 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test -p reld --bins 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test -p reld --test acceptance-policy --test external-runner 2>&1 | tee -a platform-tests.log

      - name: Linux relocation malfunction oracle
        if: matrix.kind == 'linux-gnu'
        shell: bash
        env:
          RELD_VERIFY_PLATFORM_REQUIREMENTS: "1"
          RELD_TEST_CONFIG: ${{ github.workspace }}/test-config-ci.toml
          RELD_TEST_NIGHTLY_TOOLCHAIN: ${{ env.NIGHTLY_TOOLCHAIN }}
        run: |
          set -euxo pipefail
          $CARGO_COMMAND test -p reld --test acceptance -- \
            malfunction-elf-relocation-target-plus-one \
            --test-threads=1 2>&1 | tee malfunction-tests.log

      # Reld's routed LTO modes are exercised by linker-modes.yml. These native acceptance
      # fixtures retain coverage for the pinned reference linker and its compiler plugin.
      - name: Linux LTO reference fixture compatibility
        if: matrix.kind == 'linux-gnu'
        shell: bash
        env:
          RELD_VERIFY_PLATFORM_REQUIREMENTS: "1"
          RELD_TEST_CONFIG: ${{ github.workspace }}/test-config-ci.toml
          RELD_TEST_NIGHTLY_TOOLCHAIN: ${{ env.NIGHTLY_TOOLCHAIN }}
        run: |
          set -euxo pipefail
          {
            result=0
            for test_name in \
              elf/${{ matrix.arch }}/wrap-lto/clang \
              elf/${{ matrix.arch }}/lto-integration/clang \
              elf/${{ matrix.arch }}/rust-integration-dynamic/lto \
              elf/${{ matrix.arch }}/rust-integration/linker-plugin-lto
            do
              $CARGO_COMMAND test -p reld --test acceptance -- \
                "${test_name}" --exact --test-threads=1 || result=1
            done
            exit "${result}"
          } 2>&1 | tee lto-tests.log

      - name: Linux acceptance tests
        if: matrix.kind == 'linux-gnu'
        shell: bash
        env:
          RELD_VERIFY_PLATFORM_REQUIREMENTS: "1"
          RELD_TEST_CONFIG: ${{ github.workspace }}/test-config-ci.toml
          RELD_TEST_NIGHTLY_TOOLCHAIN: ${{ env.NIGHTLY_TOOLCHAIN }}
        run: |
          set -euxo pipefail
          $CARGO_COMMAND test -p reld --test acceptance 2>&1 | tee acceptance-tests.log

      # The aarch64 leg's scope (reld#194) is the wild ELF acceptance suite; the
      # seeded difftest and the mold corpus stay x86_64-only.
      - name: Linux differential tests
        if: matrix.kind == 'linux-gnu' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euxo pipefail
          $CARGO_COMMAND run --bin reld-difftest -- --seeds 100 --reference-linker bfd 2>&1 | tee difftest.log

      - name: Linux mold corpus
        if: matrix.kind == 'linux-gnu' && matrix.arch == 'x86_64'
        shell: bash
        env:
          RELD_TEST_CONFIG: ${{ github.workspace }}/test-config-ci.toml
        run: |
          set -euxo pipefail
          $CARGO_COMMAND test -p reld --test external -- mold 2>&1 | tee external-tests.log

      - name: Windows GNU native tests
        if: matrix.kind == 'windows-gnu'
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          $CARGO_COMMAND build --workspace --all-targets --target "${{ matrix.target }}"
          $CARGO_COMMAND test --target "${{ matrix.target }}" -p reld-layout-schema -p reld-diff -p reld-testkit --all-targets 2>&1 | tee platform-tests.log
          $CARGO_COMMAND test --target "${{ matrix.target }}" -p reld-core --lib 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test --target "${{ matrix.target }}" -p reld --bins 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test --target "${{ matrix.target }}" -p reld --test acceptance-policy 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test --target "${{ matrix.target }}" -p reld --test acceptance -- --list 2>&1 | tee -a platform-tests.log

      - name: Record an earlier phase failure for the summary
        if: failure()
        shell: bash
        run: printf 'PHASE1_UPSTREAM_FAILED=true\n' >> "${GITHUB_ENV}"

      - name: Publish Linux counts and skips
        if: always() && matrix.kind == 'linux-gnu' && matrix.arch == 'x86_64'
        shell: bash
        run: >-
          uv run --no-sync python ci/phase1_summary.py --job linux-gnu
          --log platform-tests.log --log acceptance-tests.log --log difftest.log
          --log external-tests.log --versions versions.txt --minimum-run 507
          --exact-log-total difftest.log=100 --exact-log-total external-tests.log=407
          --upstream-failed "$PHASE1_UPSTREAM_FAILED"

      # --minimum-run is the first green aarch64 run's count (509, reld#194), so a fixture that
      # silently stops running fails the build instead of shrinking the evidence.
      - name: Publish Linux aarch64 counts and skips
        if: always() && matrix.kind == 'linux-gnu' && matrix.arch == 'aarch64'
        shell: bash
        run: >-
          uv run --no-sync python ci/phase1_summary.py --job linux-gnu-aarch64
          --log platform-tests.log --log acceptance-tests.log --versions versions.txt --minimum-run 509
          --upstream-failed "$PHASE1_UPSTREAM_FAILED"

      - name: Publish Windows GNU counts and skips
        if: always() && matrix.kind == 'windows-gnu'
        shell: bash
        run: >-
          uv run --no-sync python ci/phase1_summary.py --job windows-gnu --log platform-tests.log --versions versions.txt
          --upstream-failed "$PHASE1_UPSTREAM_FAILED"

  # Goal (reld#130): the Windows MSVC and macos-arm64 phase-1 legs stop
  # compiling on their scarce native runners. Compile the phase-1 test suite
  # once here, on cheap Linux runners, through the blessed soldr cross front
  # door (mirrors cross-ship.yml's cross-build job), and ship a cargo-nextest
  # archive per target. The native runner (phase1-native-run) only downloads
  # the archive and replays it -- no product compilation on-target.
  #
  # windows-gnu is intentionally NOT cross-built here: it isn't a soldr-blessed
  # cross target (soldr blesses MSVC on Windows, not the MinGW toolchain used by
  # windows-gnu), so it stays compiling on its own Windows host in
  # phase1-native, unchanged.
  phase1-cross-build:
    name: Phase 1 cross build (linux -> ${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            target: x86_64-pc-windows-msvc
            artifact: phase1-tests-windows-msvc
            format: PE32
            bins: reld.exe reld-link.exe
          - name: macos-arm64
            target: aarch64-apple-darwin
            artifact: phase1-tests-macos-arm64
            format: Mach-O
            bins: reld
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # Provision soldr + the target toolchain from the catalogue. `cross-targets`
      # runs `soldr prepare` for the triple and exports the compiler/linker/SDK/
      # sysroot/env plan -- no manual CC_/CXX_/AR_ wiring and no apt/choco/brew
      # toolchain installs (mirrors cross-ship.yml's cross-build job).
      - name: Setup Soldr (prepare cross toolchain)
        id: setup
        uses: zackees/setup-soldr@main
        with:
          # 0.9.18 ships the win-gnu prepare fix (soldr#3259); pinned to match
          # cross-ship.yml. cargo-nextest is installed at NEXTEST_VERSION in the
          # next step so the archive this job produces is replayable by the
          # same pinned cargo-nextest that phase1-native-run installs.
          version: 0.9.18
          cross-targets: ${{ matrix.target }}
          linker: fast
          cache: true
          cache-preset: full
          prebuild-deps: soldr-cook

      - name: Install pinned cargo-nextest
        shell: bash
        run: |
          set -euxo pipefail
          nextest_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "${nextest_bin}"
          curl -fsSL --retry 3 "https://get.nexte.st/${NEXTEST_VERSION}/linux" | tar zxf - -C "${nextest_bin}"
          cargo nextest --version | grep -q "${NEXTEST_VERSION}"

      - name: Build phase-1 nextest archive via soldr
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package
          soldr cargo nextest archive --locked --workspace \
            --target "${{ matrix.target }}" \
            --archive-file package/phase1-tests.tar.zst \
            --archive-format tar-zst
          for bin in ${{ matrix.bins }}; do
            cp "target/${{ matrix.target }}/debug/${bin}" "package/${bin}"
          done
          ls -la package

      - name: Verify cross artifact format
        shell: bash
        run: |
          set -euxo pipefail
          test -s package/phase1-tests.tar.zst
          for bin in ${{ matrix.bins }}; do
            file "package/${bin}" | grep -q '${{ matrix.format }}'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  # Native runner: download the phase-1 nextest archive that phase1-cross-build
  # compiled on Linux and replay it. No product compilation happens here for
  # windows-msvc/macos-arm64 -- they only download and run (reld#130).
  phase1-native-run:
    name: Phase 1 / ${{ matrix.name }}
    needs: phase1-cross-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PHASE1_UPSTREAM_FAILED: "false"
      PHASE1_NEXTEST_ARCHIVE: ${{ github.workspace }}/phase1-package/phase1-tests.tar.zst
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc x86_64
            kind: windows-msvc
            os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: phase1-tests-windows-msvc
          - name: macos arm64
            kind: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            artifact: phase1-tests-macos-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"

      - name: Sync Python tooling
        shell: bash
        run: uv sync --extra dev

      - if: matrix.kind == 'windows-msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          toolset: "14.44"

      - if: matrix.kind == 'windows-msvc'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          version: 18.1.8

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install host test tooling
        uses: taiki-e/install-action@8261f1f64137bdbc4bc1035170d52408e108cbd4 # taplo-cli
        with:
          tool: taplo-cli@0.10.0

      - name: Verify and smoke Windows MSVC reference linkers
        if: matrix.kind == 'windows-msvc'
        shell: bash
        run: uv run --no-sync python -m ci.windows_ci verify-msvc-linkers

      - name: Install macOS LLVM reference linker
        if: matrix.kind == 'macos-arm64'
        shell: bash
        run: |
          brew install llvm@18
          echo "$(brew --prefix llvm@18)/bin" >> "${GITHUB_PATH}"

      - name: Verify and smoke macOS reference linkers
        if: matrix.kind == 'macos-arm64'
        shell: bash
        run: |
          set -euxo pipefail
          xcrun ld -v 2>&1 | head -2 | tee versions.txt
          "$(brew --prefix llvm@18)/bin/ld64.lld" --version | head -1 | tee -a versions.txt
          xcrun ld -v 2>&1 | grep -q "${APPLE_LD_VERSION}"
          "$(brew --prefix llvm@18)/bin/ld64.lld" --version | grep -q "${LLD_VERSION}"
          printf 'int main(void) { return 0; }\n' > "${RUNNER_TEMP}/smoke.c"
          clang "${RUNNER_TEMP}/smoke.c" -o "${RUNNER_TEMP}/smoke-apple-ld"
          clang "${RUNNER_TEMP}/smoke.c" -fuse-ld="$(brew --prefix llvm@18)/bin/ld64.lld" -o "${RUNNER_TEMP}/smoke-lld"
          "${RUNNER_TEMP}/smoke-apple-ld"
          "${RUNNER_TEMP}/smoke-lld"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: phase1-package

      - name: Stage cross-built reld binaries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p target/debug
          case "${{ matrix.kind }}" in
            windows-msvc)
              cp phase1-package/reld.exe target/debug/
              cp phase1-package/reld-link.exe target/debug/
              ;;
            macos-arm64)
              cp phase1-package/reld target/debug/reld
              chmod +x target/debug/reld
              ;;
          esac

      - name: Install pinned cargo-nextest
        shell: bash
        run: |
          set -euxo pipefail
          nextest_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          case "${{ matrix.kind }}" in
            windows-msvc)
              # CARGO_HOME is a native Windows path (C:\Users\...\.cargo) on the
              # Windows runner; Git Bash's GNU tar reads "C:" as a remote host
              # spec, so convert it to a POSIX path before handing it to tar -C.
              nextest_bin="$(cygpath -u "${nextest_bin}")"
              nextest_url="https://get.nexte.st/${NEXTEST_VERSION}/windows-tar"
              ;;
            macos-arm64)
              nextest_url="https://get.nexte.st/${NEXTEST_VERSION}/mac"
              ;;
          esac
          mkdir -p "${nextest_bin}"
          curl -fsSL --retry 3 "${nextest_url}" | tar zxf - -C "${nextest_bin}"
          cargo nextest --version | grep -q "${NEXTEST_VERSION}"

      - name: Windows MSVC native tests
        if: matrix.kind == 'windows-msvc'
        shell: bash
        run: uv run --no-sync python -m ci.windows_ci native-tests

      - name: Windows MSVC reld bridge e2e (sqlite)
        if: matrix.kind == 'windows-msvc'
        shell: bash
        run: uv run --no-sync python -m ci.windows_ci sqlite-bridge

      - name: Windows MSVC self-host (link reld with reld-link)
        if: matrix.kind == 'windows-msvc'
        shell: bash
        run: uv run --no-sync python -m ci.windows_ci self-host

      - name: macOS native tests
        if: matrix.kind == 'macos-arm64'
        shell: bash
        env:
          PHASE1_NATIVE_FILTER: "package(reld-layout-schema) | package(reld-diff) | package(reld-testkit) | (package(reld-core) & kind(lib)) | (package(reld) & (kind(bin) | binary(acceptance-policy)))"
        run: |
          set -euxo pipefail
          cargo nextest run --archive-file "$PHASE1_NEXTEST_ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" \
            --no-fail-fast --color never -E "$PHASE1_NATIVE_FILTER" 2>&1 | tee platform-tests.log
          cargo nextest list --archive-file "$PHASE1_NEXTEST_ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" \
            --color never -E 'package(reld) & binary(acceptance)' 2>&1 | tee -a platform-tests.log

      - name: macOS reld bridge e2e (sqlite)
        if: matrix.kind == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          reld="$GITHUB_WORKSPACE/target/debug/reld"
          test -x "$reld"
          # rustc's default flavor for aarch64-apple-darwin is the cc-wrapped "darwin-cc" (clang
          # driver args). To hand reld raw ld64-native argv (which it forwards straight to
          # ld64.lld, per the BR-3 bridge), select the direct/non-cc "ld64.lld" flavor. That
          # string is a valid rustc 1.95 -C linker-flavor value (verified against the compiler's
          # own accepted list) and emits Mach-O/ld64 args (-syslibroot/-lSystem/-arch/-platform_version).
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER="$reld"
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS="-Clinker-flavor=ld64.lld"
          cd ci/e2e/sqlite-bridge
          $CARGO_COMMAND build --bin app
          output=$(./target/debug/app)
          echo "$output"
          echo "$output" | grep -q "OK"
          echo "$output" | grep -q "linked SQLite"

      - name: macOS self-host (link reld with reld)
        if: matrix.kind == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          reld="$GITHUB_WORKSPACE/target/debug/reld"
          test -x "$reld"
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER="$reld"
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS="-Clinker-flavor=ld64.lld"
          # A successful relink (reld -> ld64.lld) IS the self-host proof. Do not run the
          # self-linked reld to check it: on a macOS host reld is invoked as a linker and bridges
          # every invocation (incl. `--version`) to ld64.lld, so it can't print its own version.
          # Instead confirm the relinked binary is a well-formed Mach-O executable.
          $CARGO_COMMAND build -p reld --bin reld
          test -x "$reld"
          file "$reld"
          file "$reld" | grep -q 'Mach-O'

      - name: Record an earlier phase failure for the summary
        if: failure()
        shell: bash
        run: printf 'PHASE1_UPSTREAM_FAILED=true\n' >> "${GITHUB_ENV}"

      - name: Publish Windows MSVC counts and skips
        if: always() && matrix.kind == 'windows-msvc'
        shell: bash
        run: >-
          uv run --no-sync python ci/phase1_summary.py --job windows-msvc --log platform-tests.log --versions versions.txt
          --upstream-failed "$PHASE1_UPSTREAM_FAILED"

      - name: Publish macOS counts and skips
        if: always() && matrix.kind == 'macos-arm64'
        shell: bash
        run: >-
          uv run --no-sync python ci/phase1_summary.py --job macos-arm64 --log platform-tests.log --versions versions.txt
          --upstream-failed "$PHASE1_UPSTREAM_FAILED"

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
      - run: uv sync --extra dev
        shell: bash
      - run: uv run --no-sync python -m pytest ci/tests -q
        shell: bash

  # Release cross-compilation on cheap, plentiful Linux runners via the
  # blessed soldr front door (`soldr build --target`), which provisions the
  # mingw-w64-cross toolchain from the soldr-toolchain catalogue with ZERO
  # tools installed on the runner. Mirrors the windows-gnu leg of
  # cross-ship.yml's cross-build job (reld#59, reld#167).
  cross-release:
    name: Cross release (linux -> ${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            artifact: reld.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # Provision soldr + the target toolchain from the catalogue. `cross-targets`
      # runs `soldr prepare` for the triple and exports the compiler/linker/SDK/
      # sysroot/env plan -- no manual CC_/CXX_/AR_ wiring and no apt mingw install.
      - name: Setup Soldr (prepare cross toolchain)
        uses: zackees/setup-soldr@main
        with:
          # 0.9.18 ships the win-gnu prepare fix (soldr#3259): `soldr prepare
          # --target x86_64-pc-windows-gnu` captures the mingw-w64-cross
          # toolchain, so `cross-targets` works for win-gnu.
          version: 0.9.18
          cross-targets: ${{ matrix.target }}
          # win-gnu links via the mingw gcc's own ld: soldr's default `fast`
          # injects `-fuse-ld=lld`, which the cross gcc can't resolve.
          linker: platform-default
          cache: true
          cache-preset: full
          prebuild-deps: soldr-cook

      - name: Cross-compile reld (release) via blessed front door
        shell: bash
        run: |
          set -euxo pipefail
          # `soldr build --target` is the blessed surface: it mounts the
          # catalogue toolchain and injects target cc-rs env itself.
          soldr build --package reld --bin reld --release --locked \
            --target "${{ matrix.target }}"

      - name: Verify cross-compiled artifact
        shell: bash
        run: |
          set -euxo pipefail
          out="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          test -f "$out"
          file "$out"
          file "$out" | grep -q 'PE32'

      - name: Upload cross-compiled release artifact
        uses: actions/upload-artifact@v4
        with:
          name: reld-${{ matrix.target }}-release
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error
