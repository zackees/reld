name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: Format, clippy, and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo deny check licenses

  host-build:
    name: Host build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: cargo build --workspace --all-targets

  linux-acceptance:
    name: Linux container acceptance (debug profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the vendored development container
        run: docker build -t reld-ci -f docker/ci/ubuntu.Dockerfile .
      - name: Run the full workspace test suite
        # The default dev profile intentionally keeps debug assertions enabled, so the
        # RELD_MALFUNCTION integration cases remain active instead of silently disappearing.
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            reld-ci \
            bash -lc 'RELD_TEST_CONFIG=test-config-ci.toml cargo test --workspace'

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow pytest
      - run: python -m pytest ci/tests -q
