name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_COMMAND: cargo
  RUST_VERSION: 1.94.1
  NIGHTLY_TOOLCHAIN: nightly-2026-08-01
  CLANG_VERSION: 22.1.8
  CLANG_PACKAGE_VERSION: "1:22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80"
  LLD_VERSION: 18.1.8
  MOLD_VERSION: 2.41.0
  WILD_VERSION: 0.9.0
  MSYS2_BINUTILS_VERSION: 2.46.1-2
  MSVC_LINK_VERSION: "14.44"
  APPLE_LD_VERSION: "1053.12"
  LIBTINFO5_VERSION: "6.3-2ubuntu0.2"

jobs:
  hygiene:
    name: Format, clippy, and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@8261f1f64137bdbc4bc1035170d52408e108cbd4 # cargo-deny
        with:
          tool: cargo-deny
      - run: $CARGO_COMMAND fmt --all -- --check
      - run: $CARGO_COMMAND clippy --workspace --all-targets -- -D warnings
      - run: $CARGO_COMMAND deny check licenses

  phase1-native:
    name: Phase 1 / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gnu x86_64
            kind: linux-gnu
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: windows-gnu x86_64
            kind: windows-gnu
            os: windows-2022
            target: x86_64-pc-windows-gnu
          - name: windows-msvc x86_64
            kind: windows-msvc
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: macos arm64
            kind: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - if: matrix.kind == 'windows-gnu'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-clang

      - if: matrix.kind == 'windows-msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          toolset: "14.44"

      - if: matrix.kind != 'macos-arm64'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          version: 18.1.8

      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux fixture Rust toolchain
        if: matrix.kind == 'linux-gnu'
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install "${NIGHTLY_TOOLCHAIN}" \
            --profile minimal \
            --target x86_64-unknown-linux-musl \
            --component rustc-codegen-cranelift-preview
          rustup toolchain list | grep -q "^${NIGHTLY_TOOLCHAIN}-x86_64-unknown-linux-gnu"
          printf 'fn main() {}\n' > "${RUNNER_TEMP}/nightly-smoke.rs"
          rustup run "${NIGHTLY_TOOLCHAIN}" rustc \
            -Zcodegen-backend=cranelift \
            --target x86_64-unknown-linux-musl \
            "${RUNNER_TEMP}/nightly-smoke.rs" \
            -o "${RUNNER_TEMP}/nightly-smoke"
          "${RUNNER_TEMP}/nightly-smoke"

      - name: Install host test tooling
        uses: taiki-e/install-action@8261f1f64137bdbc4bc1035170d52408e108cbd4 # taplo-cli
        with:
          tool: taplo-cli@0.10.0

      - name: Install Linux clang toolchain
        if: matrix.kind == 'linux-gnu'
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/llvm-snapshot.gpg.key" https://apt.llvm.org/llvm-snapshot.gpg.key
          echo '8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  '${RUNNER_TEMP}'/llvm-snapshot.gpg.key' | sha256sum --check
          gpg --dearmor < "${RUNNER_TEMP}/llvm-snapshot.gpg.key" > "${RUNNER_TEMP}/llvm-snapshot.gpg"
          sudo install -m 644 "${RUNNER_TEMP}/llvm-snapshot.gpg" /usr/share/keyrings/llvm-snapshot.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y \
            "clang-22=${CLANG_PACKAGE_VERSION}" \
            "llvm-22-linker-tools=${CLANG_PACKAGE_VERSION}"

      # The mold/wild release tarballs and the libtinfo5 .deb are the heavy, pinned
      # downloads paid on every run. Cache them keyed on the pinned versions so
      # subsequent runs restore them instead of re-fetching. The version-drift
      # smoke step below is the correctness gate on a cache hit.
      - name: Restore cached Linux reference linkers
        if: matrix.kind == 'linux-gnu'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/reld-linker-cache
          key: linkers-${{ runner.os }}-mold${{ env.MOLD_VERSION }}-wild${{ env.WILD_VERSION }}-libtinfo${{ env.LIBTINFO5_VERSION }}

      - name: Provision cached Linux reference linkers
        if: matrix.kind == 'linux-gnu'
        shell: bash
        run: |
          set -euxo pipefail
          # Cache-gated: no-op for artifacts already restored above; download +
          # verify only on a miss. Installs the cached libtinfo5 .deb, symlinks
          # clang-22/clang++-22, and appends the cache bin dir to GITHUB_PATH.
          python3 ci/linker_setup.py \
            --cache-dir "${RUNNER_TEMP}/reld-linker-cache" \
            --install-debs \
            --link-clang

      - name: Verify and smoke Linux reference linkers
        if: matrix.kind == 'linux-gnu'
        shell: bash
        run: |
          set -euxo pipefail
          ld.bfd --version | head -1 | tee versions.txt
          ld.lld --version | head -1 | tee -a versions.txt
          mold --version | head -1 | tee -a versions.txt
          ld.wild --version | head -1 | tee -a versions.txt
          clang --version | head -1 | tee -a versions.txt
          ld.bfd --version | grep -q '2.42'
          ld.lld --version | grep -q "${LLD_VERSION}"
          mold --version | grep -q "${MOLD_VERSION}"
          ld.wild --version | grep -q "${WILD_VERSION}"
          clang --version | grep -q "${CLANG_VERSION}"
          printf 'int fixture(void) { return 0; }\n' | clang -shared -nostdlib -flto -x c - -fuse-ld=bfd -o "${RUNNER_TEMP}/plugin-smoke.so"
          printf 'int fixture(void) { return 0; }\n' | clang -c -x c - -Wa,--crel,--allow-experimental-crel -o "${RUNNER_TEMP}/crel-smoke.o"
          printf '.global _start\n.text\n_start:\n  mov $60, %%rax\n  xor %%rdi, %%rdi\n  syscall\n' > "${RUNNER_TEMP}/smoke.S"
          clang -c "${RUNNER_TEMP}/smoke.S" -o "${RUNNER_TEMP}/smoke.o"
          for linker in ld.bfd ld.lld mold ld.wild; do
            "${linker}" -e _start "${RUNNER_TEMP}/smoke.o" -o "${RUNNER_TEMP}/smoke-${linker}"
            test -s "${RUNNER_TEMP}/smoke-${linker}"
            "${RUNNER_TEMP}/smoke-${linker}"
          done

      - name: Verify and smoke Windows GNU reference linkers
        if: matrix.kind == 'windows-gnu'
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          llvm_bin="$(cygpath -u "${LLVM_PATH}")/bin"
          install -m 755 "${llvm_bin}/ld.lld.exe" /ucrt64/bin/ld.lld.exe
          curl -fsSL -o "${RUNNER_TEMP}/binutils.pkg.tar.zst" "https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-binutils-${MSYS2_BINUTILS_VERSION}-any.pkg.tar.zst"
          echo '631ff3c6d043a4eeca151415c313bda713537d4a7c6807eb7a2d4e7a026df89b  '${RUNNER_TEMP}'/binutils.pkg.tar.zst' | sha256sum --check
          pacman -U --noconfirm "${RUNNER_TEMP}/binutils.pkg.tar.zst"
          ld --version | head -1 | tee versions.txt
          ld.lld --version | head -1 | tee -a versions.txt
          ld.lld --version | grep -q "${LLD_VERSION}"
          pacman -Q mingw-w64-ucrt-x86_64-binutils | tee -a versions.txt
          pacman -Q mingw-w64-ucrt-x86_64-binutils | grep -q "${MSYS2_BINUTILS_VERSION}"
          printf 'int main(void) { return 0; }\n' > "${RUNNER_TEMP}/smoke.c"
          clang "${RUNNER_TEMP}/smoke.c" -fuse-ld=bfd -o "${RUNNER_TEMP}/smoke-bfd.exe"
          clang "${RUNNER_TEMP}/smoke.c" -fuse-ld=lld -o "${RUNNER_TEMP}/smoke-lld.exe"
          "${RUNNER_TEMP}/smoke-bfd.exe"
          "${RUNNER_TEMP}/smoke-lld.exe"

      - name: Verify and smoke Windows MSVC reference linkers
        if: matrix.kind == 'windows-msvc'
        shell: pwsh
        run: |
          (& link.exe 2>&1 | Select-Object -First 2) | Set-Content versions.txt
          (& lld-link --version 2>&1 | Select-Object -First 1) | Add-Content versions.txt
          $versions = Get-Content versions.txt -Raw
          if (-not $versions.Contains($env:MSVC_LINK_VERSION)) { throw "link.exe version drift" }
          if (-not $versions.Contains($env:LLD_VERSION)) { throw "lld-link version drift" }
          'int main(void) { return 0; }' | Set-Content "$env:RUNNER_TEMP\smoke.c"
          cl.exe /nologo "$env:RUNNER_TEMP\smoke.c" "/Fe:$env:RUNNER_TEMP\smoke-link.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl.exe /nologo -fuse-ld=lld "$env:RUNNER_TEMP\smoke.c" "/Fe:$env:RUNNER_TEMP\smoke-lld.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install macOS LLVM reference linker
        if: matrix.kind == 'macos-arm64'
        shell: bash
        run: |
          brew install llvm@18
          echo "$(brew --prefix llvm@18)/bin" >> "${GITHUB_PATH}"

      - name: Verify and smoke macOS reference linkers
        if: matrix.kind == 'macos-arm64'
        shell: bash
        run: |
          set -euxo pipefail
          xcrun ld -v 2>&1 | head -2 | tee versions.txt
          "$(brew --prefix llvm@18)/bin/ld64.lld" --version | head -1 | tee -a versions.txt
          xcrun ld -v 2>&1 | grep -q "${APPLE_LD_VERSION}"
          "$(brew --prefix llvm@18)/bin/ld64.lld" --version | grep -q "${LLD_VERSION}"
          printf 'int main(void) { return 0; }\n' > "${RUNNER_TEMP}/smoke.c"
          clang "${RUNNER_TEMP}/smoke.c" -o "${RUNNER_TEMP}/smoke-apple-ld"
          clang "${RUNNER_TEMP}/smoke.c" -fuse-ld="$(brew --prefix llvm@18)/bin/ld64.lld" -o "${RUNNER_TEMP}/smoke-lld"
          "${RUNNER_TEMP}/smoke-apple-ld"
          "${RUNNER_TEMP}/smoke-lld"

      - name: Linux build and native tests
        if: matrix.kind == 'linux-gnu'
        shell: bash
        env:
          RELD_VERIFY_PLATFORM_REQUIREMENTS: "1"
          RELD_TEST_CONFIG: ${{ github.workspace }}/test-config-ci.toml
        run: |
          set -euxo pipefail
          $CARGO_COMMAND build --workspace --all-targets
          bash ci/install-driver-shims.sh debug
          $CARGO_COMMAND test -p reld-layout-schema -p reld-diff -p reld-testkit --all-targets 2>&1 | tee platform-tests.log
          $CARGO_COMMAND test -p reld-core --lib 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test -p reld --bins 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test -p reld --test acceptance-policy --test external-runner 2>&1 | tee -a platform-tests.log

      - name: Linux relocation malfunction oracle
        if: matrix.kind == 'linux-gnu'
        shell: bash
        env:
          RELD_VERIFY_PLATFORM_REQUIREMENTS: "1"
          RELD_TEST_CONFIG: ${{ github.workspace }}/test-config-ci.toml
          RELD_TEST_NIGHTLY_TOOLCHAIN: ${{ env.NIGHTLY_TOOLCHAIN }}
        run: |
          set -euxo pipefail
          $CARGO_COMMAND test -p reld --test acceptance -- \
            malfunction-elf-relocation-target-plus-one \
            --test-threads=1 2>&1 | tee malfunction-tests.log

      - name: Linux LTO fixture compatibility
        if: matrix.kind == 'linux-gnu'
        shell: bash
        env:
          RELD_VERIFY_PLATFORM_REQUIREMENTS: "1"
          RELD_TEST_CONFIG: ${{ github.workspace }}/test-config-ci.toml
          RELD_TEST_NIGHTLY_TOOLCHAIN: ${{ env.NIGHTLY_TOOLCHAIN }}
        run: |
          set -euxo pipefail
          {
            result=0
            for test_name in \
              elf/x86_64/wrap-lto/clang \
              elf/x86_64/lto-integration/clang \
              elf/x86_64/rust-integration-dynamic/lto \
              elf/x86_64/rust-integration/linker-plugin-lto
            do
              $CARGO_COMMAND test -p reld --test acceptance -- \
                "${test_name}" --exact --test-threads=1 || result=1
            done
            exit "${result}"
          } 2>&1 | tee lto-tests.log

      - name: Linux acceptance tests
        if: matrix.kind == 'linux-gnu'
        shell: bash
        env:
          RELD_VERIFY_PLATFORM_REQUIREMENTS: "1"
          RELD_TEST_CONFIG: ${{ github.workspace }}/test-config-ci.toml
          RELD_TEST_NIGHTLY_TOOLCHAIN: ${{ env.NIGHTLY_TOOLCHAIN }}
        run: |
          set -euxo pipefail
          $CARGO_COMMAND test -p reld --test acceptance 2>&1 | tee acceptance-tests.log

      - name: Linux differential tests
        if: matrix.kind == 'linux-gnu'
        shell: bash
        run: |
          set -euxo pipefail
          $CARGO_COMMAND run --bin reld-difftest -- --seeds 100 --reference-linker bfd 2>&1 | tee difftest.log

      - name: Linux mold corpus
        if: matrix.kind == 'linux-gnu'
        shell: bash
        env:
          RELD_TEST_CONFIG: ${{ github.workspace }}/test-config-ci.toml
        run: |
          set -euxo pipefail
          $CARGO_COMMAND test -p reld --test external -- mold 2>&1 | tee external-tests.log

      - name: Windows GNU native tests
        if: matrix.kind == 'windows-gnu'
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          $CARGO_COMMAND build --workspace --all-targets --target "${{ matrix.target }}"
          $CARGO_COMMAND test --target "${{ matrix.target }}" -p reld-layout-schema -p reld-diff -p reld-testkit --all-targets 2>&1 | tee platform-tests.log
          $CARGO_COMMAND test --target "${{ matrix.target }}" -p reld-core --lib 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test --target "${{ matrix.target }}" -p reld --bins 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test --target "${{ matrix.target }}" -p reld --test acceptance-policy 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test --target "${{ matrix.target }}" -p reld --test acceptance -- --list 2>&1 | tee -a platform-tests.log

      - name: Windows MSVC native tests
        if: matrix.kind == 'windows-msvc'
        shell: pwsh
        run: |
          & $env:CARGO_COMMAND build --workspace --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARGO_COMMAND test -p reld-layout-schema -p reld-diff -p reld-testkit --all-targets 2>&1 | Tee-Object platform-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARGO_COMMAND test -p reld-core --lib 2>&1 | Tee-Object -Append platform-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARGO_COMMAND test -p reld --bins 2>&1 | Tee-Object -Append platform-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARGO_COMMAND test -p reld --test acceptance-policy 2>&1 | Tee-Object -Append platform-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARGO_COMMAND test -p reld --test acceptance -- --list 2>&1 | Tee-Object -Append platform-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows MSVC reld bridge e2e (sqlite)
        if: matrix.kind == 'windows-msvc'
        shell: pwsh
        run: |
          $reld = "$env:GITHUB_WORKSPACE\target\debug\reld-link.exe"
          if (-not (Test-Path $reld)) { throw "reld-link.exe not found at $reld" }
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = $reld
          Push-Location "$env:GITHUB_WORKSPACE\ci\e2e\sqlite-bridge"
          try {
            $output = & $env:CARGO_COMMAND run --quiet --bin app 2>&1 | Out-String
          } finally {
            Pop-Location
          }
          Write-Output $output
          if ($LASTEXITCODE -ne 0) { throw "sqlite-bridge e2e exited with code $LASTEXITCODE" }
          if ($output -notmatch "OK") { throw "sqlite-bridge e2e output did not contain OK marker" }
          if ($output -notmatch "linked SQLite") { throw "sqlite-bridge e2e output did not contain 'linked SQLite' marker" }

      - name: Windows MSVC reld-bench smoke
        if: matrix.kind == 'windows-msvc'
        shell: pwsh
        run: |
          & $env:CARGO_COMMAND run --release -p reld-testkit --bin reld-bench -- --cc clang --linker lld --trials 2 --warmup 1 | Tee-Object benchmark-windows-msvc.md
          if ($LASTEXITCODE -ne 0) { throw "reld-bench exited with code $LASTEXITCODE" }
          if (-not (Test-Path benchmark-windows-msvc.md)) { throw "benchmark-windows-msvc.md not produced" }
          $table = Get-Content benchmark-windows-msvc.md -Raw
          if (-not ($table | Select-String -Pattern '## Link Benchmark:' -Quiet)) { throw "benchmark table missing '## Link Benchmark:' heading" }
          if (-not ($table | Select-String -Pattern '\| *reld *\|' -Quiet)) { throw "benchmark table missing reld column" }

      - name: Upload Windows MSVC benchmark artifact
        if: always() && matrix.kind == 'windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-windows-msvc
          path: benchmark-windows-msvc.md
          if-no-files-found: warn

      - name: Windows MSVC self-host (link reld with reld-link)
        if: matrix.kind == 'windows-msvc'
        shell: pwsh
        run: |
          $reld = "$env:GITHUB_WORKSPACE\target\debug\reld-link.exe"
          if (-not (Test-Path $reld)) { throw "reld-link.exe not found at $reld" }
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = $reld
          & $env:CARGO_COMMAND build -p reld --bin reld
          if ($LASTEXITCODE -ne 0) { throw "self-host build (link reld with reld-link) failed" }
          $out = & "$env:GITHUB_WORKSPACE\target\debug\reld.exe" --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "self-linked reld --version failed (exit $LASTEXITCODE)" }
          Write-Output $out
          if ($out -notmatch 'Reld') { throw "self-linked reld --version output missing 'Reld' marker" }

      - name: macOS native tests
        if: matrix.kind == 'macos-arm64'
        shell: bash
        run: |
          set -euxo pipefail
          $CARGO_COMMAND build --workspace --all-targets
          $CARGO_COMMAND test -p reld-layout-schema -p reld-diff -p reld-testkit --all-targets 2>&1 | tee platform-tests.log
          $CARGO_COMMAND test -p reld-core --lib 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test -p reld --bins 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test -p reld --test acceptance-policy 2>&1 | tee -a platform-tests.log
          $CARGO_COMMAND test -p reld --test acceptance -- --list 2>&1 | tee -a platform-tests.log

      - name: macOS reld bridge e2e (sqlite)
        if: matrix.kind == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          reld="$GITHUB_WORKSPACE/target/debug/reld"
          test -x "$reld"
          # rustc's default flavor for aarch64-apple-darwin is the cc-wrapped "darwin-cc" (clang
          # driver args). To hand reld raw ld64-native argv (which it forwards straight to
          # ld64.lld, per the BR-3 bridge), select the direct/non-cc "ld64.lld" flavor. That
          # string is a valid rustc 1.94 -C linker-flavor value (verified against the compiler's
          # own accepted list) and emits Mach-O/ld64 args (-syslibroot/-lSystem/-arch/-platform_version).
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER="$reld"
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS="-Clinker-flavor=ld64.lld"
          cd ci/e2e/sqlite-bridge
          $CARGO_COMMAND build --bin app
          output=$(./target/debug/app)
          echo "$output"
          echo "$output" | grep -q "OK"
          echo "$output" | grep -q "linked SQLite"

      - name: macOS reld-bench smoke
        if: matrix.kind == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          $CARGO_COMMAND run --release -p reld-testkit --bin reld-bench -- --cc clang --linker lld --trials 2 --warmup 1 | tee benchmark-macos-arm64.md
          grep -q '## Link Benchmark:' benchmark-macos-arm64.md || { echo "benchmark table missing '## Link Benchmark:' heading" >&2; exit 1; }
          grep -qE '\| *reld *\|' benchmark-macos-arm64.md || { echo "benchmark table missing reld column" >&2; exit 1; }

      - name: macOS self-host (link reld with reld)
        if: matrix.kind == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          reld="$GITHUB_WORKSPACE/target/debug/reld"
          test -x "$reld"
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER="$reld"
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS="-Clinker-flavor=ld64.lld"
          # A successful relink (reld -> ld64.lld) IS the self-host proof. Do not run the
          # self-linked reld to check it: on a macOS host reld is invoked as a linker and bridges
          # every invocation (incl. `--version`) to ld64.lld, so it can't print its own version.
          # Instead confirm the relinked binary is a well-formed Mach-O executable.
          $CARGO_COMMAND build -p reld --bin reld
          test -x "$reld"
          file "$reld"
          file "$reld" | grep -q 'Mach-O'

      - name: Upload macOS benchmark artifact
        if: always() && matrix.kind == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-macos-arm64
          path: benchmark-macos-arm64.md
          if-no-files-found: warn

      - name: Publish Linux counts and skips
        if: always() && matrix.kind == 'linux-gnu'
        shell: bash
        run: >-
          python ci/phase1_summary.py --job linux-gnu
          --log platform-tests.log --log acceptance-tests.log --log difftest.log
          --log external-tests.log --versions versions.txt --minimum-run 507
          --exact-log-total difftest.log=100 --exact-log-total external-tests.log=407

      - name: Publish Windows GNU counts and skips
        if: always() && matrix.kind == 'windows-gnu'
        shell: pwsh
        run: python ci/phase1_summary.py --job windows-gnu --log platform-tests.log --versions versions.txt

      - name: Publish Windows MSVC counts and skips
        if: always() && matrix.kind == 'windows-msvc'
        shell: pwsh
        run: python ci/phase1_summary.py --job windows-msvc --log platform-tests.log --versions versions.txt

      - name: Publish macOS counts and skips
        if: always() && matrix.kind == 'macos-arm64'
        shell: bash
        run: python3 ci/phase1_summary.py --job macos-arm64 --log platform-tests.log --versions versions.txt

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow pytest
      - run: python -m pytest ci/tests -q

  # Release cross-compilation on cheap, plentiful Linux runners. Building the
  # Windows target from Linux exploits parallel Linux capacity for the compile +
  # link phases (native on-target *test* execution stays on the native matrix
  # legs above). soldr provides content-addressed build caching across runs.
  cross-release:
    name: Cross release (linux -> ${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            artifact: reld.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install mingw-w64 cross toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Set up soldr (build cache)
        uses: zackees/setup-soldr@v0
        with:
          cache: true

      - name: Cross-compile reld (release)
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          set -euxo pipefail
          rustup target add "${{ matrix.target }}"
          soldr cargo build --release --target "${{ matrix.target }}" -p reld --bin reld

      - name: Verify cross-compiled artifact
        shell: bash
        run: |
          set -euxo pipefail
          out="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          test -f "$out"
          file "$out"
          file "$out" | grep -q 'PE32'

      - name: Upload cross-compiled release artifact
        uses: actions/upload-artifact@v4
        with:
          name: reld-${{ matrix.target }}-release
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error
