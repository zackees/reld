name: Cross ship (build off-platform, run on-platform)

# Goal (reld#59): keep the heavy compile/link OFF the scarce Windows/macOS
# runners. Cross-build the release product on cheap, plentiful ubuntu runners
# through the BLESSED soldr front door (`soldr build --target <triple>`), which
# provisions compiler + linker + SDK + sysroot from the soldr-toolchain
# catalogue with ZERO tools installed on the runner (no apt mingw, no choco
# llvm, no brew llvm). Then ship only the finished binary to the native runner,
# which downloads it and runs against it — no product compilation on-target.
#
# Blessed cross-from-Linux targets per soldr/ci/canonical-targets.json:
#   x86_64-pc-windows-msvc  (win-x64,  xwin + auto CC_/CXX_/AR_ injection)
#   aarch64-apple-darwin    (mac-arm64, zig + catalogue Apple SDK)
# windows-gnu IS cross-built from Linux, via soldr's mingw-w64-cross
# toolchain. Its leg carries extra weight: it also proves that reld itself,
# built for the Linux host, links a MinGW PE hello-world on Linux
# (`clang --target=x86_64-w64-mingw32 --ld-path=reld`, reld#184, the #123
# Phase 3 exit), and that the resulting exe runs on the Windows runner.
# The macos-arm64 leg likewise proves that reld itself, built for the Linux
# host, links a Mach-O hello-world on Linux
# (`clang --target=arm64-apple-macos11 --ld-path=reld`, reld#192, the #123
# Phase 3 exit), and that the resulting exe runs on the macos-14 host-run
# runner.
#
# NOTE: validated — this workflow ran green on main across all six jobs
# (https://github.com/zackees/reld/actions/runs/35276124820) and is no longer a
# draft. It still runs additively alongside `ci.yml`'s cross legs; migrating
# `ci.yml`'s cross-release and native reld-bench build steps onto it is a
# separate, tracked step. See reld#59.

on:
  workflow_dispatch:
  schedule:
    # Weekly, offset off the hour to avoid the Actions rush.
    - cron: "37 6 * * 1"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ci/cross_ship_metrics.py"
      - "ci/tests/test_cross_ship_metrics.py"
      - ".github/workflows/cross-ship.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ci/cross_ship_metrics.py"
      - "ci/tests/test_cross_ship_metrics.py"
      - ".github/workflows/cross-ship.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Cross-compile the release product on ubuntu via the blessed soldr front
  # door. No compiler toolchain is installed here — setup-soldr's `cross-targets`
  # runs `soldr prepare`, which owns compiler/linker/SDK/sysroot selection.
  cross-build:
    name: Cross build (linux -> ${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            target: x86_64-pc-windows-msvc
            linker: fast
            artifact: reld-windows-x86_64-msvc
            executable: reld.exe
          - name: macos-arm64
            target: aarch64-apple-darwin
            linker: fast
            artifact: reld-macos-arm64
            executable: reld
          # windows-gnu cross-from-Linux: soldr provisions the Linux-hosted
          # mingw cross gcc toolchain (soldr-toolchain#114 Phase 2) via
          # `soldr prepare --target`, so no hand-installed `gcc-mingw-w64`.
          #
          # linker: platform-default — the mingw gcc driver links with its
          # own bundled `x86_64-w64-mingw32-ld`. soldr's default `fast`
          # injects `-fuse-ld=lld`, which the cross gcc can't resolve
          # (collect2: cannot find 'ld').
          - name: windows-gnu
            target: x86_64-pc-windows-gnu
            linker: platform-default
            artifact: reld-windows-x86_64-gnu
            executable: reld.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # Provision soldr + the target toolchain from the catalogue. `cross-targets`
      # runs `soldr prepare` for the triple and exports the compiler/linker/SDK/
      # sysroot/env plan. Heavy caching is the point (reld#59): this repo has a
      # large cache budget, so we exercise setup-soldr's caching hard and report
      # the hit rate below.
      - name: Setup Soldr (prepare cross toolchain)
        id: setup
        uses: zackees/setup-soldr@main
        with:
          # 0.9.18 ships the win-gnu prepare fix (soldr#3259): `soldr prepare
          # --target x86_64-pc-windows-gnu` captures the mingw-w64-cross
          # toolchain, so `cross-targets` works for win-gnu.
          version: 0.9.18
          cross-targets: ${{ matrix.target }}
          # win-gnu links via the mingw gcc's own ld (see matrix note).
          linker: ${{ matrix.linker }}
          cache: true
          cache-preset: full
          prebuild-deps: soldr-cook

      - name: Cross-compile reld (release) via blessed front door
        id: compile
        shell: bash
        run: |
          set -euxo pipefail
          compile_start="$(date +%s)"
          # `soldr build --target` is the blessed surface: it mounts the
          # catalogue toolchain and injects target cc-rs env itself. No manual
          # CC_/CXX_/AR_ and no apt/choco/brew toolchain installs.
          soldr build --package reld --bin reld --release --locked \
            --target "${{ matrix.target }}"
          mkdir -p package
          built="$(find "target/${{ matrix.target }}/release" -maxdepth 1 -type f \
            \( -name 'reld' -o -name 'reld.exe' \) -print -quit)"
          test -n "$built"
          cp "$built" "package/${{ matrix.executable }}"
          compile_end="$(date +%s)"
          echo "wall-seconds=$((compile_end - compile_start))" >> "$GITHUB_OUTPUT"

      - name: Verify cross artifact format
        shell: bash
        run: |
          set -euxo pipefail
          test -s "package/${{ matrix.executable }}"
          file "package/${{ matrix.executable }}"
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc) file "package/${{ matrix.executable }}" | grep -q 'PE32' ;;
            x86_64-pc-windows-gnu)  file "package/${{ matrix.executable }}" | grep -q 'PE32' ;;
            aarch64-apple-darwin)   file "package/${{ matrix.executable }}" | grep -q 'Mach-O' ;;
          esac

      # reld#184 (#123 Phase 3 exit): prove reld itself, built for the Linux
      # host (no --target: this reld runs on ubuntu, not on the mingw
      # target), links a MinGW PE when handed to clang as --ld-path. Only
      # runs for windows-gnu; the exe is shipped to host-run to prove it also
      # executes on the Windows runner.
      - name: Link a MinGW hello-world with reld (linux host, reld#184)
        if: matrix.name == 'windows-gnu'
        shell: bash
        run: |
          set -euxo pipefail
          soldr build --package reld --bin reld --release --locked
          host_reld="$PWD/target/release/reld"
          test -x "$host_reld"

          # clang resolves the MinGW sysroot off the x86_64-w64-mingw32-gcc it
          # finds on PATH, so locate the soldr-provisioned cross gcc and
          # prepend its directory.
          mingw_gcc="$(command -v x86_64-w64-mingw32-gcc || true)"
          if [ -z "$mingw_gcc" ]; then
            # `|| true`: under `set -o pipefail`, find's non-zero exit on an
            # unreadable directory (or SIGPIPE from `head`) must not abort.
            mingw_gcc="$( { find "$HOME" /opt -type f -name x86_64-w64-mingw32-gcc -perm -u+x 2>/dev/null || true; } | head -n1 || true)"
          fi
          if [ -z "$mingw_gcc" ]; then
            echo "::error::could not locate x86_64-w64-mingw32-gcc (soldr-provisioned mingw toolchain) on PATH or under $HOME or /opt"
            exit 1
          fi
          export PATH="$(dirname "$mingw_gcc"):$PATH"

          mkdir -p mingw-hello
          cat > mingw-hello/hello.c <<'EOF'
          #include <stdio.h>
          int main(void){puts("hello from reld (mingw)");return 0;}
          EOF

          command -v clang >/dev/null || { echo "::error::clang not found on ubuntu-24.04 (ships clang; not apt-installing)"; exit 1; }

          # soldr's mingw package uses a conda layout: headers and import libs
          # live under <root>/x86_64-w64-mingw32/sysroot/usr, which clang's
          # MinGW driver doesn't probe (it expects <root>/x86_64-w64-mingw32/
          # include). Point it there explicitly when that layout is present.
          sysroot_flags=()
          mingw_sysroot="$(dirname "$(dirname "$mingw_gcc")")/x86_64-w64-mingw32/sysroot/usr"
          if [ -d "$mingw_sysroot/include" ]; then
            sysroot_flags=(-isystem "$mingw_sysroot/include" -L"$mingw_sysroot/lib")
          fi

          RELD_LOG_ENGINE=1 RELD_INVOCATION_LOG="$PWD/mingw-hello/invocations.jsonl" \
            clang --target=x86_64-w64-mingw32 --ld-path="$host_reld" \
            "${sysroot_flags[@]}" \
            mingw-hello/hello.c -o mingw-hello/hello.exe

          file mingw-hello/hello.exe | grep -q 'PE32+'
          # Proves reld handled the link (lld-mingw engine), not a fallback
          # system linker.
          grep -q '"engine":"lld-mingw"' mingw-hello/invocations.jsonl

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows-gnu'
        with:
          name: reld-mingw-hello
          path: mingw-hello/hello.exe
          if-no-files-found: error

      # reld#192 (#123 Phase 3 exit, macho_from_linux_links): prove reld
      # itself, built for the Linux host (no --target), links a Mach-O
      # binary when handed to clang as --ld-path. clang's Darwin driver
      # emits ld64-flavored argv (`-arch arm64 -platform_version ...`);
      # reld's TargetProbe routes that to the ld64.lld engine (rust-lld
      # -flavor darwin) on Linux, keyed on the Mach-O target rather than the
      # host. lld ad-hoc signs the arm64 output so macOS will exec it. Only
      # runs for macos-arm64; the exe is shipped to host-run, the only leg
      # that can actually execute a Mach-O binary, to prove it runs there.
      - name: Link a Mach-O hello-world with reld (linux host, reld#192)
        if: matrix.name == 'macos-arm64'
        shell: bash
        run: |
          set -euxo pipefail
          # setup-soldr's aarch64-apple-darwin cross prep exports
          # CARGO_ENCODED_RUSTFLAGS with Apple link-args (`--target=arm64-apple-darwin
          # -isysroot ... -fuse-ld=lld`). Cargo applies it to every unit when no
          # --target is given, so this host build's build scripts would link as
          # Darwin. Drop it for the host build only.
          env -u CARGO_ENCODED_RUSTFLAGS -u RUSTFLAGS \
            soldr build --package reld --bin reld --release --locked
          host_reld="$PWD/target/release/reld"
          test -x "$host_reld"

          command -v clang >/dev/null || { echo "::error::clang not found on ubuntu-24.04 (ships clang; not apt-installing)"; exit 1; }

          mkdir -p macho-hello
          # No Apple SDK on the Linux runner: declare puts ourselves and link against a
          # hand-written libSystem text stub (TAPI v4) that ld64.lld reads as a dylib.
          cat > macho-hello/hello.c <<'EOF'
          int puts(const char *);
          int main(void){puts("hello from reld (mach-o)");return 0;}
          EOF
          cat > macho-hello/libSystem.tbd <<'EOF'
          --- !tapi-tbd
          tbd-version:     4
          targets:         [ arm64-macos ]
          install-name:    '/usr/lib/libSystem.B.dylib'
          current-version: 1319
          exports:
            - targets:         [ arm64-macos ]
              symbols:         [ _puts, dyld_stub_binder ]
          ...
          EOF

          clang --target=arm64-apple-macos11 -c macho-hello/hello.c -o macho-hello/hello.o

          # -fuse-ld=lld alongside --ld-path tells clang's Darwin driver the linker
          # speaks lld's ld64 dialect, so it emits `-platform_version` rather than
          # the legacy `-macos_version_min` it falls back to for an unknown ld64
          # version on a non-Apple host. clang consumes both flags; reld only ever
          # sees the ld64 argv.
          RELD_LOG_ENGINE=1 RELD_INVOCATION_LOG="$PWD/macho-hello/invocations.jsonl" \
            clang --target=arm64-apple-macos11 -fuse-ld=lld --ld-path="$host_reld" -nostdlib \
            macho-hello/hello.o macho-hello/libSystem.tbd -o macho-hello/hello

          file macho-hello/hello | grep -q 'Mach-O 64-bit.*arm64'
          # Proves reld handled the link on the Linux host through the ld64.lld engine,
          # keyed on the Mach-O target rather than the host (reld#192).
          grep -q '"engine":"ld64.lld"' macho-hello/invocations.jsonl
          grep -q '"reason":"target:mach-o"' macho-hello/invocations.jsonl

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'macos-arm64'
        with:
          name: reld-macho-hello
          path: macho-hello/hello
          if-no-files-found: error

      # Report setup-soldr's caching outcome — reld#59 wants this as the
      # success metric for "how well setup-soldr caching works".
      - name: Report soldr cache metrics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/cross_ship_metrics.py \
            --target "${{ matrix.name }}" \
            --triple "${{ matrix.target }}" \
            --cache-hit "${{ steps.setup.outputs.cache-hit }}" \
            --build-cache-hit "${{ steps.setup.outputs.build-cache-hit }}" \
            --target-cache-hit "${{ steps.setup.outputs.target-cache-hit }}" \
            --compile-cache-hits "${{ steps.setup.outputs.compile-cache-hits }}" \
            --compile-cache-misses "${{ steps.setup.outputs.compile-cache-misses }}" \
            --compile-cache-hit-rate "${{ steps.setup.outputs.compile-cache-hit-rate }}" \
            --wall-seconds "${{ steps.compile.outputs.wall-seconds }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/${{ matrix.executable }}
          if-no-files-found: error

  # Native runner: download the cross-built binary and exercise it. No product
  # compilation happens here — this is the whole point.
  host-run:
    name: Host run / ${{ matrix.name }}
    needs: cross-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            runner: windows-2022
            artifact: reld-windows-x86_64-msvc
            executable: reld.exe
          - name: macos-arm64
            runner: macos-14
            artifact: reld-macos-arm64
            executable: reld
          - name: windows-gnu
            runner: windows-2022
            artifact: reld-windows-x86_64-gnu
            executable: reld.exe
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package

      # This job is the only part of the workflow on scarce runners, so it does
      # exactly one thing the Linux build job cannot: execute the binary on the
      # real OS (reld#174). The format check already happened in `cross-build`.
      # For windows-gnu it does one more thing (reld#184): run the MinGW
      # hello-world that reld itself linked on the Linux host, proving the PE
      # that reld's lld-mingw engine produced actually executes here.
      #
      # `-flavor gnu --version` selects the native ELF argument model on any
      # host, so reld's own code answers — `Reld … (compatible with GNU
      # linkers)` — with no external linker involved. A bare `--version`
      # bridges to lld-link / ld64.lld and would only prove that linker exists.
      # The version token is not asserted: build.rs makes it depend on checkout
      # depth and tags.

      - name: Smoke deployed reld (windows)
        if: startsWith(matrix.name, 'windows')
        shell: pwsh
        run: |
          $exe = ".\package\${{ matrix.executable }}"

          $native = & $exe -flavor gnu --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "reld -flavor gnu --version exited with $LASTEXITCODE" }
          Write-Output $native
          if ($native -notmatch '^Reld .*\(compatible with GNU linkers\)') {
            throw "reld's own code did not answer -flavor gnu --version"
          }

          # The lld-link hand-off is part of the Windows product, so keep it.
          $bridge = & $exe --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "deployed reld exited with $LASTEXITCODE" }
          Write-Output $bridge
          if ($bridge -notmatch 'LLD') { throw "deployed reld --version missing the lld-link bridge marker" }

      # reld#184: the mingw hello-world that reld's lld-mingw engine linked
      # on the Linux host in `cross-build`. Downloaded separately from
      # `package/reld.exe` because it's a different product of the same job.
      - uses: actions/download-artifact@v4
        if: matrix.name == 'windows-gnu'
        with:
          name: reld-mingw-hello
          path: mingw-hello

      - name: Run reld-linked MinGW hello-world (reld#184)
        if: matrix.name == 'windows-gnu'
        shell: pwsh
        run: |
          $out = & .\mingw-hello\hello.exe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "reld-linked hello.exe exited with $LASTEXITCODE" }
          Write-Output $out
          if ($out -notmatch 'hello from reld \(mingw\)') { throw "unexpected output from reld-linked hello.exe" }

      # On Apple Silicon the kernel kills an arm64 executable with a missing or
      # invalid code signature at exec, which no format check can see. Running
      # it is the point of this leg.
      - name: Smoke deployed reld (macos-arm64)
        if: matrix.name == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          exe="package/${{ matrix.executable }}"
          chmod +x "$exe"
          out="$("$exe" -flavor gnu --version 2>&1)"
          echo "$out"
          grep -Eq '^Reld .*\(compatible with GNU linkers\)' <<<"$out" \
            || { echo "::error::reld's own code did not answer -flavor gnu --version"; exit 1; }

      # reld#192: the Mach-O hello-world that reld's ld64.lld engine linked
      # on the Linux host in `cross-build`. Downloaded separately from
      # `package/reld` because it's a different product of the same job.
      - uses: actions/download-artifact@v4
        if: matrix.name == 'macos-arm64'
        with:
          name: reld-macho-hello
          path: macho-hello

      # This is the half of macho_from_linux_links that only the macOS
      # runner can prove: executing the Mach-O binary reld linked on Linux
      # requires a valid ad-hoc signature, which no format check can see.
      - name: Run reld-linked Mach-O hello-world (reld#192)
        if: matrix.name == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x macho-hello/hello
          out="$(./macho-hello/hello 2>&1)"
          echo "$out"
          grep -q 'hello from reld (mach-o)' <<<"$out" \
            || { echo "::error::unexpected output from reld-linked Mach-O hello"; exit 1; }
