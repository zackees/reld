name: Publish release site

on:
  # Releases are created with the Release workflow's GITHUB_TOKEN, so GitHub
  # intentionally suppresses a follow-on `release` event workflow. A completed
  # Release workflow is the reliable hand-off after every asset is published.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build HTTP artifact catalog
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${REPOSITORY}/releases?per_page=100" > releases.json
          python3 ci/release_manifest.py catalog \
            --repository "$REPOSITORY" \
            --releases-json releases.json \
            --online-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json" \
            --template site/index.html \
            --output-dir _site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
