[workspace]
resolver = "2"
members = [
    "crates/reld",
    "crates/reld-testkit",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/zackees/reld"
authors = ["zackees"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sanitizer and stress runs are dominated by the linker under test, not by
# our harness — but an unoptimized generator makes multi-thousand-object
# workloads unbearable, so keep dev builds fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
