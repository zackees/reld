[skipped_groups.ignore]
reason = "Known output or diagnostic differences from GNU-family semantics; see per-test comments"
tracking_issue = 14
tests = [
  "arch-riscv64-global-pointer.sh", # GNU ld and lld do not export `__global_pointer$` to `.dynsym`.
  "arch-riscv64-obj-compatible.sh", # Different message formats
  "arch-riscv64-relax-j.sh",        # Passes when `--no-gc-sections` is passed.
  "arch-x86_64-empty-arg.sh",       # Different message formats
  "arch-x86_64-note.sh",            # The order of sections is different.
  "arch-x86_64-note2.sh",           # The order of sections is different.
  "arch-x86_64-plt.sh",             # We use `.got.plt`, not `.plt.got`.
  "arch-x86_64-reloc-overflow.sh",  # Different message formats
  "as-needed-weak.sh",              # Mold-specific behaviour: GNU ld and lld do not activate --as-needed libs for weak refs
  "auxiliary.sh",                   # Different message format
  "build-id.sh",                    # Different build ID data size
  "cmdline.sh",                     # Different message formats for unknown options.
  "comment.sh",                     # We store a different string in the comment section than mold.
  "copyrel-alignment.sh",           # We put copy relocation info to `.bss`
  "copyrel-norelro.sh",             # We put copy relocation info to `.bss`
  "copyrel-protected.sh",           # We put copy relocation info to `.bss`
  "copyrel-relro.sh",               # We put copy relocation info to `.bss`
  "copyrel-relro2.sh",              # We put copy relocation info to `.bss`
  "demangle.sh",                    # Different message formats
  "duplicate-error-archive.sh",     # Different message formats
  "duplicate-error-gc-sections.sh", # Different message formats
  "duplicate-error.sh",             # Different message formats
  "empty-input.sh",                 # Different message formats
  "gc-sections.sh",                 # Passes when `--no-gc-sections` is passed.
  "hash-style.sh",                  # Reld doesn't support `--hash-style=none`.
  "hidden-undef.sh",                # Reld correctly errors, but message format differs from mold's.
  "help.sh",
  "invalid-version-script.sh",      # Different message formats
  "linker-script-error.sh",         # Different message formats
  "many-output-sections.sh",        # Different message formats
  "mold-wrapper.sh",
  "mold-wrapper2.sh",
  "nmagic.sh",                      # end is only emitted if .bss section exists. LLD also fails.
  "no-allow-shlib-undefined.sh",    # Different message formats
  "no-allow-shlib-undefined3.sh",   # Different message formats
  "no-allow-shlib-undefined4.sh",   # GNU ld and LLD also fail
  "plt-symbols.sh",                 # Reld currently doesn't create entries in the symbol table with the `$plt` suffix unless `--got-plt-syms` is specified
  "run-clang.sh",                   # This test checks the comment section to verify if it's linked with mold.
  "start-lib.sh",                   # Passes when `--no-gc-sections` is passed.
  "stdout.sh",
  "undefined.sh",                   # Passes when `--no-gc-sections` is passed.
  "undefined2.sh",                  # Passes when `--no-gc-sections` is passed.
  "unresolved-symbols.sh",          # Different message formats
  "verbose.sh",
  "version.sh",                     # The message of `--version` is different from mold's one.
  "warn-unresolved-symbols.sh",     # Different message formats
  "whole-archive.sh",               # Passes when `--no-gc-sections` is passed.
  "z-defs.sh",                      # Different message formats
]

