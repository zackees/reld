[package]
name = "reld"
description = "A very fast linker for Linux"
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
autotests = false

[[bin]]
name = "reld"
path = "src/main.rs"

[[bin]]
name = "reld-link"
path = "src/bin/reld-link.rs"

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
harness = false

# Keep the external-suite entry point separate at the Cargo level so it can be
# scheduled independently on the Linux runner. The libtest-mimic name filter
# selects only external trials for this target.
[[test]]
name = "external"
path = "tests/external.rs"
harness = false

[[test]]
name = "external-runner"
path = "tests/external_runner.rs"

[[test]]
name = "acceptance-policy"
path = "tests/acceptance_policy_tests.rs"

[dependencies]
reld-core = { path = "../reld-core", version = "0.0.0", default-features = false }

# Exact crates.io dependency approved in #97. Production builds use the system
# allocator; this dependency is compiled only for explicit diagnostic modes.
mimalloc-pprof = { workspace = true, optional = true }

[dev-dependencies]
ar.workspace = true
bitflags.workspace = true
blake3.workspace = true
diff.workspace = true
itertools.workspace = true
foldhash.workspace = true
gimli.workspace = true
hex.workspace = true
reld-diff.path = "../reld-diff"
reld-layout-schema.path = "../reld-layout-schema"
libloading.workspace = true
libtest-mimic = { workspace = true }
object.workspace = true
os_info.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde-keyvalue = { workspace = true }
strum.workspace = true
tempfile.workspace = true
toml.workspace = true
which.workspace = true

[target.'cfg(not(target_os = "wasi"))'.dev-dependencies]
wait-timeout.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[features]
default = ["fork", "plugins", "zstd"]

# Compile pprof hooks in; collection remains opt-in through mimalloc's API or
# documented environment controls.
mimalloc-pprof-profile = ["dep:mimalloc-pprof", "mimalloc-pprof/pprof"]

# Exact DHAT profiling is provided internally by the same mimalloc-pprof
# allocator, avoiding a second global allocator.
mimalloc-pprof-dhat = ["dep:mimalloc-pprof"]

fork = ["reld-core/fork"]

zstd = ["reld-core/zstd"]

plugins = ["reld-core/plugins"]

perfetto = ["reld-core/perfetto"]

macho = ["reld-core/macho"]

# external tests
external_tests = ["mold_tests"]
mold_tests = []
