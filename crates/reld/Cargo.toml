[package]
name = "reld"
description = "A very fast linker for Linux"
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
autotests = false

[[bin]]
name = "reld"
path = "src/main.rs"

[[bin]]
name = "reld-link"
path = "src/bin/reld-link.rs"

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
harness = false

# Keep the external-suite entry point separate at the Cargo level so it can be
# scheduled independently on the Linux runner. The libtest-mimic name filter
# selects only external trials for this target.
[[test]]
name = "external"
path = "tests/external.rs"
harness = false

[dependencies]
reld-core = { path = "../reld-core", version = "0.0.0", default-features = false }

# This is off by default, since it doesn't appear to help. However, if you're linking against musl
# libc, which has a comparatively slow allocator, then enabling this does help. To enable this,
# build with `--features mimalloc`.
mimalloc = { workspace = true, optional = true }

dhat = { workspace = true, optional = true }

[dev-dependencies]
ar.workspace = true
bitflags.workspace = true
blake3.workspace = true
diff.workspace = true
itertools.workspace = true
foldhash.workspace = true
gimli.workspace = true
hex.workspace = true
reld-diff.path = "../reld-diff"
reld-layout-schema.path = "../reld-layout-schema"
libloading.workspace = true
libtest-mimic = { workspace = true }
object.workspace = true
os_info.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde-keyvalue = { workspace = true }
strum.workspace = true
tempfile.workspace = true
toml.workspace = true
which.workspace = true

[target.'cfg(not(target_os = "wasi"))'.dev-dependencies]
wait-timeout.workspace = true

[features]
default = ["fork", "plugins", "zstd"]

fork = ["reld-core/fork"]

zstd = ["reld-core/zstd"]

plugins = ["reld-core/plugins"]

perfetto = ["reld-core/perfetto"]

macho = ["reld-core/macho"]

# external tests
external_tests = ["mold_tests"]
mold_tests = []
